<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浅野物理部 カウンター</title>
    <!-- Supabaseのライブラリを読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #count-value {
            font-size: 60px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <!-- 認証画面 -->
    <div id="auth-screen" class="card">
        <h2>物理部員 専用ページ</h2>
        <p>合言葉を入力してください</p>
        <input type="password" id="password-input" placeholder="合言葉">
        <button id="login-btn">入室</button>
        <p id="error-msg" style="color: red; display: none; margin-top: 10px;">合言葉が違います</p>
    </div>

    <!-- カウンター画面（最初は非表示） -->
    <div id="counter-screen" class="card" style="display: none;">
        <h1>浅野物理部 カウンター</h1>
        <div id="count-value">読込中...</div>
        <button id="increment-btn">＋1 増やす</button>
    </div>

    <script>
        // === 設定 ===
        const SUPABASE_URL = 'https://hddmqdqlavzflqzcmijj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4wDSFHVBYnWUmEvqBPDvKw_6rq4tP3d';
        const correctWord = "morning ph";
        // ==============================================

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authScreen = document.getElementById("auth-screen");
        const counterScreen = document.getElementById("counter-screen");
        const passwordInput = document.getElementById("password-input");
        const loginBtn = document.getElementById("login-btn");
        const errorMsg = document.getElementById("error-msg");
        const countValueElem = document.getElementById("count-value");
        const incrementBtn = document.getElementById("increment-btn");

        let currentCount = 0;

        loginBtn.addEventListener("click", () => {
            if (passwordInput.value === correctWord) {
                authScreen.style.display = "none";
                counterScreen.style.display = "inline-block";
                initCounter(); 
            } else {
                errorMsg.style.display = "block";
            }
        });

        passwordInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") loginBtn.click();
        });

        // ボタンのクリックイベントは1回だけ登録
        incrementBtn.addEventListener("click", async () => {
            currentCount += 1;
            countValueElem.textContent = currentCount;

            const { error: updateError } = await supabaseClient
                .from('counter')
                .update({ count: currentCount })
                .eq('id', 1);

            if (updateError) console.error(updateError);
        });

        async function initCounter() {
            // 最初の一回データを取得
            const { data, error } = await supabaseClient
                .from('counter')
                .select('count')
                .eq('id', 1)
                .single();

            if (error) {
                console.error(error);
                countValueElem.textContent = "エラー";
                return;
            }

            currentCount = data.count;
            countValueElem.textContent = currentCount;

            // リアルタイムリスナーの開始（他の端末での変更をキャッチ）
            supabaseClient
                .channel('public:counter')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'counter' }, (payload) => {
                    currentCount = payload.new.count;
                    countValueElem.textContent = currentCount;
                })
                .subscribe();
        }
    </script>
</body>
</html>
